[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scitex-bridge"
version = "0.1.0"
description = "Cross-module adapters: scitex.stats ↔ matplotlib annotations, scitex.stats ↔ vis FigureModel, scitex.plt ↔ vis — standalone module from the SciTeX ecosystem"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.9"
authors = [{name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai"}]
keywords = ["scitex", "bridge", "matplotlib", "figrecipe", "annotations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = ["scitex-bridge[dev]", "scitex-bridge[docs]"]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-bridge"
Repository = "https://github.com/ywatanabe1989/scitex-bridge"
Documentation = "https://scitex-bridge.readthedocs.io"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--disable-warnings"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]
